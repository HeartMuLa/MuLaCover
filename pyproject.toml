[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mulacover"
version = "0.1.0"
description = "Controllable AI cover-song and music-remix generation from reference audio or symbolic MIDI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MuLa Labs"}]
keywords = ["cover", "cover song", "music remix", "AI remix", "music generation", "audio-to-audio", "symbolic music"]
dependencies = [
    "numpy==2.0.2",
    "torch>=2.4,<2.11",
    "torchao==0.9.0",
    "torchtune==0.4.0",
    "tqdm==4.67.1",
    "transformers==4.57.6",
    "tokenizers==0.22.1",
    "einops==0.8.1",
    "accelerate==1.12.0",
    "vector-quantize-pytorch==1.27.15",
    "soundfile>=0.12",
    "mido>=1.3,<2",
]

[project.optional-dependencies]
audio = [
    "torchaudio>=2.4,<2.11",
    "librosa>=0.10.2,<0.12",
    "scipy>=1.10,<2",
]

[project.scripts]
mulacover = "mulacover.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSING.md", "MODEL_LICENSE"]

[tool.setuptools.package-data]
"mulacover._symbolic_transcription" = ["**/*.txt", "**/*.md", "**/LICENSE*"]
